name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.22.1' }
      - run: npm ci
      - run: npm ci
        working-directory: coworker
      - run: npm test
      - run: npm test
        working-directory: coworker
      - run: sh scripts/smoke.sh
